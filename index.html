<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudRP — загрузка</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#17496a; }
    .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
    video { display:block; }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="autumn.gif">
    <source src="autumn.mp4" type="video/mp4">
  </video>
  <script>
    (function(){
      var video=document.querySelector('video');
      var fallback=null;
      function showFallback(){
        if (fallback) return;
        fallback=document.createElement('img');
        fallback.className='bg';
        fallback.src='autumn.gif';
        fallback.alt='Осенний экран загрузки CloudRP';
        video.style.display='none';
        document.body.appendChild(fallback);
      }
      video.addEventListener('error',showFallback);
      var promise=video.play();
      if (promise && typeof promise.catch==='function') promise.catch(showFallback);
    })();
  </script>
</body>
</html>
